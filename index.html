
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NovaHost Panel</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080d18;color:white;font-family:Arial,sans-serif}
.container{max-width:440px;margin:70px auto;padding:25px}
.logo{text-align:center;font-size:32px;font-weight:900;color:#22d3ee}
.logo span{color:white}
.card{background:#101a2a;padding:25px;border:1px solid #263c54;border-radius:15px;margin-top:25px}
h2{text-align:center}
input{width:100%;padding:14px;margin:9px 0;background:#080d18;color:white;border:1px solid #30445e;border-radius:8px}
button{width:100%;padding:14px;background:#22d3ee;color:#07111b;border:0;border-radius:8px;font-weight:bold;margin-top:12px}
.link{color:#22d3ee;text-align:center;cursor:pointer;margin-top:18px}
.msg{text-align:center;color:#22d3ee;font-size:13px;margin-top:15px}
.hidden{display:none}
.dashboard{max-width:900px;margin:30px auto;padding:20px}
.panel-card{background:#101a2a;padding:22px;border-radius:12px;margin-top:15px}
.logout{background:#e34b62;color:white}
</style>
</head>
<body>

<div id="auth" class="container">
<div class="logo">NOVA<span>HOST</span></div>

<div class="card" id="login">
<h2>Connexion client</h2>
<form id="loginForm">
<input id="loginEmail" type="email" placeholder="Adresse email" required>
<input id="loginPassword" type="password" placeholder="Mot de passe" required>
<button type="submit">Se connecter</button>
</form>
<div class="link" onclick="showRegister()">Créer un compte</div>
</div>

<div class="card hidden" id="register">
<h2>Créer un compte</h2>
<form id="registerForm">
<input id="username" type="text" placeholder="Nom d'utilisateur" required>
<input id="registerEmail" type="email" placeholder="Adresse email" required>
<input id="registerPassword" type="password" placeholder="Mot de passe (8 caractères minimum)" minlength="8" required>
<button type="submit">S'inscrire</button>
</form>
<div class="link" onclick="showLogin()">Déjà un compte ? Connexion</div>
</div>
<div id="message" class="msg"></div>
</div>

<div id="dashboard" class="dashboard hidden">
<div class="logo">NOVA<span>HOST</span></div>
<div class="panel-card">
<h2>Bienvenue sur NovaHost !</h2>
<p>Connecté en tant que :</p>
<strong id="userEmail"></strong>
</div>
<div class="panel-card">
<h3>Mes serveurs</h3>
<p>Aucun serveur pour le moment.</p>
</div>
<div class="panel-card">
<h3>Mon compte</h3>
<p id="profileName"></p>
<button class="logout" onclick="logout()">Se déconnecter</button>
</div>
</div>

<script>
const SUPABASE_URL = "https://basynpfbmginduprjtwe.supabase.co";
const SUPABASE_KEY = "sb_publishable_MEHlD2PSVJDCzkbkDNTRwQ_S3EoRnEZ";

const client = supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

const auth = document.getElementById("auth");
const dashboard = document.getElementById("dashboard");
const message = document.getElementById("message");

function showRegister(){
document.getElementById("login").classList.add("hidden");
document.getElementById("register").classList.remove("hidden");
message.textContent="";
}

function showLogin(){
document.getElementById("register").classList.add("hidden");
document.getElementById("login").classList.remove("hidden");
message.textContent="";
}

function showDashboard(user){
auth.classList.add("hidden");
dashboard.classList.remove("hidden");
document.getElementById("userEmail").textContent=user.email;
document.getElementById("profileName").textContent=
"Compte : "+(user.user_metadata.username || "Client");
}

document.getElementById("registerForm").addEventListener("submit",async e=>{
e.preventDefault();
message.textContent="Création du compte...";
const username=document.getElementById("username").value.trim();
const email=document.getElementById("registerEmail").value;
const password=document.getElementById("registerPassword").value;

const {data,error}=await client.auth.signUp({
email,password,
options:{data:{username}}
});

if(error){
message.textContent=error.message;
return;
}

if(data.session){
showDashboard(data.user);
}else{
message.textContent="Inscription réussie ! Vérifie tes emails pour confirmer ton compte.";
}
});

document.getElementById("loginForm").addEventListener("submit",async e=>{
e.preventDefault();
message.textContent="Connexion...";
const email=document.getElementById("loginEmail").value;
const password=document.getElementById("loginPassword").value;

const {data,error}=await client.auth.signInWithPassword({
email,password
});

if(error){
message.textContent="Erreur : "+error.message;
return;
}
showDashboard(data.user);
});

async function logout(){
await client.auth.signOut();
dashboard.classList.add("hidden");
auth.classList.remove("hidden");
showLogin();
}

async function init(){
const {data:{session}}=await client.auth.getSession();
if(session)showDashboard(session.user);
}

client.auth.onAuthStateChange((event,session)=>{
if(session && event==="SIGNED_IN"){
showDashboard(session.user);
}
});

init();
</script>
</body>
</html>
